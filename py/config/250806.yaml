behaviors: 
  MyGrasp: 
    trainer_type: ppo
    hyperparameters:
      batch_size: 64
      buffer_size: 2048
      learning_rate: 5.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 10
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      torch_device: cuda
    reward_signals:
      extrinsic:
        gamma: 0.0
        strength: 1.0
    max_steps: 1000000
    time_horizon: 1
    summary_freq: 500
    checkpoint_interval: 500